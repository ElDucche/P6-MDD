server:
  port: 8080

spring:
  application:
    name: mdd-application

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mdd}
    username: ${POSTGRES_USER:mdd_user}
    password: ${POSTGRES_PASSWORD:mdd_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:monSecretJwtTresSolideEtComplexe}
  expiration: ${JWT_EXPIRATION:86400000}

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  packages-to-scan: com.elducche.mdd.controller

# Logging
logging:
  level:
    "[com.elducche.mdd]": DEBUG
    "[org.springframework.security]": DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
