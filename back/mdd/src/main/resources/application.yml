server:
  port: 8080

spring:
  application:
    name: mdd-application

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mdd_db}
    username: ${POSTGRES_USER:user}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

# JWT Configuration
jwt:
  # Clé par défaut de 64+ octets pour HS512 (à surcharger en prod via env var JWT_SECRET)
  secret: ${JWT_SECRET:u0C2cZ2Qb9mL5xN8pR3tV6yH1kJ4sM7nP0aB3dE6fH9jK2lN5qT8wY1uC4rV7xZ0}
  expiration: ${JWT_EXPIRATION:86400000}

# Configuration OpenAPI
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  paths-to-exclude: /error

# Logging
logging:
  level:
    "[com.elducche.mdd]": DEBUG
    "[org.springframework.security]": DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
